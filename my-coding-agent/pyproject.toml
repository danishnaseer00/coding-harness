[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-harness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
harness = "cli:main"

[tool.setuptools]
py-modules = ["cli", "agent", "tools", "memory", "context", "display", "providers"]
